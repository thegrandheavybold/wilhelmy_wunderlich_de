[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    NODE_VERSION = "20.19.0"


[dev]
  publish = "dist"
  port = 8888
  autoLaunch = false


[build.processing.html]
  pretty_urls = true


[[redirects]]
  from = "/assets/img/:file"
  to = "/.netlify/images?url=/assets/img/:file"
  status = 200

[[redirects]]
  from = "/assets/img/:width/:file"
  to = "/.netlify/images?url=/assets/img/:file&width=:width"
  status = 200

[[redirects]]
  from = "/kontakt"
  to = "/kontakt-anfahrt"
  status = 301
  force = true

[[redirects]]
  from = "/arzte"
  to = "/team"
  status = 301
  force = true

[[redirects]]
  from = "*"
  to = "/404"
  status = 404



[[plugins]]
package = "@netlify/plugin-sitemap"

  [plugins.inputs]
  buildDir = "dist"

  exclude = [
    "./dist/index.html",    # extra safe
  ]
